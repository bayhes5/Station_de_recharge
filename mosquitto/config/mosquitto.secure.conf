# Configuration Mosquitto pour un déploiement de borne.
#
# Préparer le fichier de mots de passe avec :
#   .\scripts\init-mqtt-auth.ps1
#
# Puis monter ce fichier et remplacer `mosquitto.conf` par cette configuration
# dans le service Docker `mqtt`, ou copier ce contenu dans `mosquitto.conf`.

per_listener_settings true

listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
