# Configuration Mosquitto locale pour le développement.
#
# Cette configuration reste volontairement ouverte afin de simplifier les tests
# Docker, Wokwi et ESP32 sur le réseau local. Pour une borne réelle, utiliser
# `mosquitto.secure.conf` avec un fichier de mots de passe et des ACL.

per_listener_settings true

listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
