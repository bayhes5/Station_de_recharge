# Conservative baseline for the Debian production/integration server.
# Tune these values again when the final server RAM and workload are known.

shared_preload_libraries = 'timescaledb'

listen_addresses = '*'
max_connections = 100
shared_buffers = 256MB
effective_cache_size = 1GB
maintenance_work_mem = 128MB
work_mem = 8MB

wal_compression = on
checkpoint_completion_target = 0.9

log_min_duration_statement = 1000
log_statement = 'ddl'
log_checkpoints = on
log_connections = on
log_disconnections = on
