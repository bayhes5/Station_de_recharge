apiVersion: 1

groups:
  - orgId: 1
    name: station-production-alerts
    folder: Station de recharge
    interval: 1m
    rules:
      - uid: station_esp32_offline
        title: Contrôleur sans signal
        condition: B
        data:
          - refId: A
            datasourceUid: station-timescaledb
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: postgres
                uid: station-timescaledb
              format: table
              intervalMs: 1000
              maxDataPoints: 43200
              rawQuery: true
              rawSql: |
                SELECT COUNT(*)::double precision AS value
                FROM device d
                WHERE d.status <> 'provisioned'
                  AND (d.last_seen IS NULL OR d.last_seen < NOW() - INTERVAL '2 minutes');
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "Un ou plusieurs contrôleurs ne publient plus d'état ou de télémétrie."
        labels:
          severity: warning
          domain: supervision

      - uid: station_temperature_high
        title: Température contrôleur élevée
        condition: B
        data:
          - refId: A
            datasourceUid: station-timescaledb
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: postgres
                uid: station-timescaledb
              format: table
              intervalMs: 1000
              maxDataPoints: 43200
              rawQuery: true
              rawSql: |
                SELECT COUNT(*)::double precision AS value
                FROM capteur_data cd
                JOIN capteur c ON c.id_capteur = cd.id_capteur
                WHERE c.type = 'temperature'
                  AND cd.timestamp >= NOW() - INTERVAL '5 minutes'
                  AND cd.valeur >= 60;
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Une température ESP32 dépasse le seuil de sécurité."
        labels:
          severity: critical
          domain: supervision

      - uid: station_current_abnormal
        title: Courant anormal
        condition: B
        data:
          - refId: A
            datasourceUid: station-timescaledb
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: postgres
                uid: station-timescaledb
              format: table
              intervalMs: 1000
              maxDataPoints: 43200
              rawQuery: true
              rawSql: |
                SELECT COUNT(*)::double precision AS value
                FROM capteur_data cd
                JOIN capteur c ON c.id_capteur = cd.id_capteur
                WHERE c.type = 'current'
                  AND cd.timestamp >= NOW() - INTERVAL '5 minutes'
                  AND cd.valeur >= 3.0;
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Un courant mesuré dépasse le seuil attendu."
        labels:
          severity: critical
          domain: supervision

      - uid: station_charge_without_session
        title: Charge sans session active
        condition: B
        data:
          - refId: A
            datasourceUid: station-timescaledb
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: postgres
                uid: station-timescaledb
              format: table
              intervalMs: 1000
              maxDataPoints: 43200
              rawQuery: true
              rawSql: |
                SELECT COUNT(*)::double precision AS value
                FROM device d
                WHERE d.status = 'charging'
                  AND NOT EXISTS (
                    SELECT 1
                    FROM charging_session cs
                    WHERE cs.id_emplacement = d.id_emplacement
                      AND cs.end_time IS NULL
                  );
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Un emplacement remonte une charge alors qu'aucune session backend n'est ouverte."
        labels:
          severity: critical
          domain: supervision

      - uid: station_energy_over_limit
        title: Énergie de session élevée
        condition: B
        data:
          - refId: A
            datasourceUid: station-timescaledb
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: postgres
                uid: station-timescaledb
              format: table
              intervalMs: 1000
              maxDataPoints: 43200
              rawQuery: true
              rawSql: |
                SELECT COUNT(*)::double precision AS value
                FROM session_telemetry st
                JOIN charging_session cs ON cs.id_session = st.id_session
                WHERE cs.end_time IS NULL
                  AND st.timestamp >= NOW() - INTERVAL '5 minutes'
                  AND st.energie_kwh >= 1.5;
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "Une session active dépasse le plafond d'énergie configuré."
        labels:
          severity: warning
          domain: supervision

      - uid: station_session_without_telemetry
        title: Session active sans télémétrie
        condition: B
        data:
          - refId: A
            datasourceUid: station-timescaledb
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: postgres
                uid: station-timescaledb
              format: table
              intervalMs: 1000
              maxDataPoints: 43200
              rawQuery: true
              rawSql: |
                SELECT COUNT(*)::double precision AS value
                FROM charging_session cs
                WHERE cs.end_time IS NULL
                  AND cs.start_time < NOW() - INTERVAL '2 minutes'
                  AND NOT EXISTS (
                    SELECT 1
                    FROM session_telemetry st
                    WHERE st.id_session = cs.id_session
                      AND st.timestamp >= NOW() - INTERVAL '2 minutes'
                  );
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "Une session active ne reçoit plus de télémétrie récente."
        labels:
          severity: warning
          domain: supervision
