name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Run pytest
        working-directory: backend
        run: python -m pytest

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Check docstring style
        working-directory: backend
        run: python -m ruff check .

      - name: Check docstring coverage
        working-directory: backend
        run: python -m interrogate api

  frontend-verify:
    name: Frontend verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect frontend changes
        id: frontend_changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          else
            changed_files="$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}")"
          fi

          echo "$changed_files"
          if echo "$changed_files" | grep -Eq '^(frontend/|package-lock\.json$|package\.json$|playwright\.config\.js$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No frontend changes detected; skipping frontend verification."
          fi

      - name: Set up Node
        if: steps.frontend_changes.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.frontend_changes.outputs.run == 'true'
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        if: steps.frontend_changes.outputs.run == 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Verify frontend
        if: steps.frontend_changes.outputs.run == 'true'
        working-directory: frontend
        run: npm run verify

  docs-build:
    name: Documentation build
    runs-on: ubuntu-latest

    env:
      DEBUG: "True"
      SECRET_KEY: docs-ci-secret-key-with-more-than-50-characters-for-autodoc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            docs/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Build documentation
        run: python -m sphinx -b html docs/source docs/build/html
