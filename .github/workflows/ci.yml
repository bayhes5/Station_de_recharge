name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Run pytest
        working-directory: backend
        run: python -m pytest

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        working-directory: backend
        run: python -m ruff check .

      - name: Validate OpenAPI schema
        working-directory: backend
        env:
          DEBUG: "True"
          SECRET_KEY: schema-ci-secret-key-with-more-than-50-characters-for-openapi
        run: python manage.py spectacular --validate --file /tmp/schema.yml

      - name: Validate deployment checks
        working-directory: backend
        env:
          ALLOWED_HOSTS: station.example.com
          CSRF_COOKIE_SECURE: "True"
          DEBUG: "False"
          GRAFANA_ADMIN_PASSWORD: grafana-production-password
          JWT_REFRESH_COOKIE_SECURE: "True"
          MQTT_ACK_REQUIRED: "True"
          MQTT_PASSWORD: mqtt-production-password
          MQTT_RASPBERRY_PASSWORD: raspberry-production-password
          MQTT_RASPBERRY_USERNAME: raspberry-kiosk
          MQTT_TLS_ENABLED: "True"
          MQTT_USERNAME: station-backend
          SECRET_KEY: station-production-secret-key-with-enough-random-length
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          SECURE_HSTS_PRELOAD: "True"
          SECURE_HSTS_SECONDS: "31536000"
          SESSION_COOKIE_SECURE: "True"
          SMS_BACKEND: brevo
          SMS_BREVO_API_KEY: brevo-production-api-key
          SMS_REQUIRE_VERIFIED_PHONE: "True"
          TERMINAL_API_SECRET: terminal-production-secret-with-enough-length
        run: python manage.py check --deploy

      - name: Check docstring coverage
        working-directory: backend
        run: python -m interrogate api

  raspberry-tests:
    name: Raspberry edge tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: raspberry/app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install pytest
          python -m pip install -r raspberry/app/requirements.txt

      - name: Compile Raspberry modules
        run: |
          python -m py_compile \
            raspberry/app/charge_state.py \
            raspberry/app/main.py \
            raspberry/app/mqtt_contract.py \
            raspberry/app/mqtt_client.py \
            raspberry/app/offline_store.py \
            raspberry/app/rfid_reader.py

      - name: Run Raspberry tests
        run: python -m pytest raspberry/tests -q

  frontend-verify:
    name: Frontend verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect frontend changes
        id: frontend_changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          else
            changed_files="$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}")"
          fi

          echo "$changed_files"
          if echo "$changed_files" | grep -Eq '^(frontend/|package-lock\.json$|package\.json$|playwright\.config\.js$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No frontend changes detected; skipping frontend verification."
          fi

      - name: Set up Node
        if: steps.frontend_changes.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.frontend_changes.outputs.run == 'true'
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        if: steps.frontend_changes.outputs.run == 'true'
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Verify frontend
        if: steps.frontend_changes.outputs.run == 'true'
        working-directory: frontend
        run: npm run verify

  production-config:
    name: Production configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare production environment file
        run: cp .env.example .env

      - name: Validate production Docker Compose
        run: docker compose --env-file .env.example -f docker-compose.prod.yml config --quiet

      - name: Validate production shell scripts
        run: |
          bash -n scripts/backup-prod.sh
          bash -n scripts/restore-prod.sh

  docs-build:
    name: Documentation build
    runs-on: ubuntu-latest

    env:
      DEBUG: "True"
      SECRET_KEY: docs-ci-secret-key-with-more-than-50-characters-for-autodoc

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            docs/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Build documentation
        run: python -m sphinx -b html docs/source docs/build/html
