name: Generate SBOM and VEX

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  backend-image-supply-chain:
    name: Backend image supply chain reports
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SBOM, vulnerability reports and OpenVEX draft
        shell: pwsh
        run: |
          ./scripts/generate-sbom.ps1 `
            -Target backend-image `
            -UseDockerSyft `
            -AnalyzeVulnerabilities `
            -UseDockerGrype

      - name: Upload supply chain artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-supply-chain-reports
          path: |
            sbom/*.json
            sbom/*.sarif

      - name: Upload vulnerability SARIF
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sbom/station-de-recharge.vulnerabilities.sarif
