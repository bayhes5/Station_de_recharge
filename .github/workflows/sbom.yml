name: Generate SBOM and VEX

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  backend-image-supply-chain:
    name: Backend image supply chain reports
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t station-de-recharge-backend:sbom ./backend

      - name: Export backend image
        run: |
          mkdir -p sbom
          docker save station-de-recharge-backend:sbom -o sbom/backend-image.tar

      - name: Generate SBOM, vulnerability reports and OpenVEX draft
        shell: pwsh
        run: |
          ./scripts/generate-sbom.ps1 `
            -Target backend-image `
            -ImageName "docker-archive:/work/sbom/backend-image.tar" `
            -ProductId "pkg:docker/station-de-recharge-backend@sbom" `
            -SkipImageBuild `
            -UseDockerSyft `
            -AnalyzeVulnerabilities `
            -UseDockerGrype

      - name: Summarize vulnerabilities
        shell: pwsh
        run: ./scripts/summarize-vulnerabilities.ps1

      - name: Upload supply chain artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-supply-chain-reports
          path: |
            sbom/*.json
            sbom/*.md
            sbom/*.sarif

      - name: Upload vulnerability SARIF
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sbom/station-de-recharge.vulnerabilities.sarif
