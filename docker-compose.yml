#version: '3.8'

services:
  backend:
    build: ./backend
    container_name: django_app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: station
      DB_USER: admin
      DB_PASSWORD: admin
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    # Command will be overridden by Dev Container

  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: station
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d station"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: