services:
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_DB: station
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:  # <-- Ajoute ceci
      test: ["CMD-SHELL", "pg_isready -U user -d station"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: django_app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=station
      - DB_USER=user
      - DB_PASSWORD=password
      - ADMIN_PSEUDO=admin
      - ADMIN_EMAIL=admin@station.local
      - ADMIN_PASSWORD=Admin123!
    depends_on:
      db:
        condition: service_healthy  # <-- Attend que le healthcheck passe
    command: sh -c "python manage.py migrate --noinput && python manage.py bootstrap_superuser && python manage.py runserver 0.0.0.0:8000"

  frontend:
     image: nginx:alpine
     container_name: frontend_app
     volumes:
       - ./frontend:/usr/share/nginx/html
     ports:
       - "8080:80"
     depends_on:
       - backend

volumes:
    postgres_data:  # Volume pour persister les données de PostgreSQL
