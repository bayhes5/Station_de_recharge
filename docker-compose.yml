services:
  db:
    image: postgres:15
    container_name: postgres_db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: django_app
    env_file:
      - .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh /app/docker-entrypoint.sh

  frontend:
     image: nginx:alpine
     container_name: frontend_app
     volumes:
       - ./frontend:/usr/share/nginx/html
     ports:
       - "8080:80"
     depends_on:
       - backend

  raspberry:
    image: python:3.11-slim
    container_name: raspberry_kiosk
    working_dir: /app
    volumes:
      - ./raspberry/app:/app
    ports:
      - "9000:9000"
    command: python main.py
    depends_on:
      - backend

volumes:
  postgres_data:  # Volume pour persister les données de PostgreSQL
