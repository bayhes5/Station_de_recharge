services:
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: postgres_db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2
    container_name: mqtt_broker
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 3 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: dev
    container_name: django_app
    env_file:
      - .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    command: sh /app/docker-entrypoint.sh

  celery:
    build:
      context: ./backend
      target: dev
    container_name: celery_worker
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l info

  mqtt-bridge:
    build:
      context: ./backend
      target: dev
    container_name: mqtt_bridge
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    command: python manage.py run_mqtt_bridge

  grafana:
    image: grafana/grafana-oss:12.3.0
    container_name: grafana_supervision
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  backend-test:
    build:
      context: ./backend
      target: test
    profiles:
      - test
    command: python -m pytest
    env_file:
      - .env

  frontend:
    image: node:22-alpine
    container_name: frontend_app
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    command: sh -c "npm ci && npm run dev"
    depends_on:
      - backend

  raspberry:
    image: python:3.11-slim
    container_name: raspberry_kiosk
    working_dir: /app
    volumes:
      - ./raspberry/app:/app
    ports:
      - "9000:9000"
    command: python main.py
    depends_on:
      - backend

volumes:
  frontend_node_modules:
  grafana_data:
  mqtt_data:
  mqtt_log:
  postgres_data:  # Volume pour persister les données de PostgreSQL
