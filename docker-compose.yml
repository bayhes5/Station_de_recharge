services:
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: postgres_db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.30.0
    container_name: mailpit
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    ports:
      - "8025:8025"
      - "1025:1025"

  mqtt:
    image: eclipse-mosquitto:2
    container_name: mqtt_broker
    env_file:
      - .env
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    ports:
      - "1883:1883"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "AUTH=''; if [ -n \"$$MQTT_USERNAME\" ]; then AUTH=\"-u $$MQTT_USERNAME -P $$MQTT_PASSWORD\"; fi; mosquitto_pub -h localhost $$AUTH -t 'station/health' -m 'ok' >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: dev
    container_name: django_app
    env_file:
      - .env
    environment:
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Station <no-reply@station.local>}
      ALERT_EMAIL_NOTIFICATIONS_ENABLED: ${ALERT_EMAIL_NOTIFICATIONS_ENABLED:-true}
      TERMINAL_API_SECRET: ${TERMINAL_API_SECRET:-dev-terminal-secret}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready/', timeout=3).read()"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: sh /app/docker-entrypoint.sh

  celery:
    build:
      context: ./backend
      target: dev
    container_name: celery_worker
    env_file:
      - .env
    environment:
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Station <no-reply@station.local>}
      ALERT_EMAIL_NOTIFICATIONS_ENABLED: ${ALERT_EMAIL_NOTIFICATIONS_ENABLED:-true}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout=3 >/dev/null 2>&1"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s
    command: celery -A config worker -l info

  celery-beat:
    build:
      context: ./backend
      target: dev
    container_name: celery_beat
    env_file:
      - .env
    environment:
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Station <no-reply@station.local>}
      ALERT_EMAIL_NOTIFICATIONS_ENABLED: ${ALERT_EMAIL_NOTIFICATIONS_ENABLED:-true}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

  mqtt-bridge:
    build:
      context: ./backend
      target: dev
    container_name: mqtt_bridge
    env_file:
      - .env
    environment:
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Station <no-reply@station.local>}
      ALERT_EMAIL_NOTIFICATIONS_ENABLED: ${ALERT_EMAIL_NOTIFICATIONS_ENABLED:-true}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_mqtt_bridge_health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: python manage.py run_mqtt_bridge

  mqtt-simulator:
    build:
      context: ./backend
      target: dev
    container_name: mqtt_simulator
    profiles:
      - simulation
    env_file:
      - .env
    volumes:
      - ./backend:/app
    environment:
      BACKEND_API_BASE_URL: http://backend:8000/api
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_BASE_TOPIC: station
    depends_on:
      mqtt:
        condition: service_healthy
    command: python manage.py simulate_mqtt_telemetry --slots slot1 slot2 slot3 --scenario mixed --interval 2

  grafana:
    image: grafana/grafana-oss:12.1.0
    container_name: grafana_supervision
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  backend-test:
    build:
      context: ./backend
      target: test
    profiles:
      - test
    command: python -m pytest
    env_file:
      - .env

  frontend:
    image: node:22-alpine
    container_name: frontend_app
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://backend:8000
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

  raspberry:
    build:
      context: ./raspberry
    container_name: raspberry_kiosk
    working_dir: /app
    volumes:
      - ./raspberry/app:/app:ro
    ports:
      - "9000:9000"
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_BASE_TOPIC: station
      MQTT_RASPBERRY_CLIENT_ID: raspberry-kiosk
      MQTT_ACK_TIMEOUT_SECONDS: ${MQTT_ACK_TIMEOUT_SECONDS:-2.5}
      MQTT_ACK_REQUIRED: ${MQTT_ACK_REQUIRED:-false}
      BACKEND_API_BASE_URL: http://backend:8000/api
      TERMINAL_API_SECRET: ${TERMINAL_API_SECRET:-dev-terminal-secret}
      TERMINAL_STATION_ID: ${TERMINAL_STATION_ID:-}
      TERMINAL_BORNE_ID: ${TERMINAL_BORNE_ID:-}
      OFFLINE_DB_PATH: /tmp/offline_cache.sqlite3
      CHARGE_STATE_DB_PATH: /tmp/charge_state.sqlite3
    depends_on:
      - backend
      - mqtt

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: nginx_reverse_proxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
      - grafana
      - raspberry

volumes:
  frontend_node_modules:
  grafana_data:
  mailpit_data:
  mqtt_data:
  mqtt_log:
  postgres_data:  # Volume pour persister les données de PostgreSQL
