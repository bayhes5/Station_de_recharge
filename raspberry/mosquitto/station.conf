# Mosquitto configuration for a Raspberry Pi station broker.
#
# Install path:
#   /etc/mosquitto/conf.d/station.conf
#
# This file is intentionally different from the Docker configuration because
# Debian Mosquitto uses /etc/mosquitto, /var/lib/mosquitto and systemd.

per_listener_settings true

listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/aclfile

# Persistence and default logging are already configured by
# /etc/mosquitto/mosquitto.conf on Debian/Raspberry Pi OS.
connection_messages true
