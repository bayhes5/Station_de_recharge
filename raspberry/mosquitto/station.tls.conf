# Mosquitto TLS configuration for the Raspberry Pi station broker.
#
# Install path when MQTT TLS is ready:
#   /etc/mosquitto/conf.d/station.conf
#
# Required files on the Raspberry:
#   /etc/station/mqtt-certs/metropole-verte-root-ca.crt
#   /etc/station/mqtt-certs/mqtt.crt
#   /etc/station/mqtt-certs/mqtt.key
#
# The MQTT certificate must include the real broker address in its SAN, for
# example IP:192.168.10.1 and any DNS name used by the ESP32/backend clients.

per_listener_settings true

listener 8883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/aclfile
cafile /etc/station/mqtt-certs/metropole-verte-root-ca.crt
certfile /etc/station/mqtt-certs/mqtt.crt
keyfile /etc/station/mqtt-certs/mqtt.key

# Keep this disabled once every client has migrated to TLS.
# A temporary 1883 listener can be kept during migration, but should remain
# limited to the local station network.
#
# listener 1883 0.0.0.0
# protocol mqtt
# allow_anonymous false
# password_file /etc/mosquitto/passwd
# acl_file /etc/mosquitto/aclfile

connection_messages true
