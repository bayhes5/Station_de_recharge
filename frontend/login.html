<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Station de recharge</title>
    <link rel="stylesheet" href="/css/auth.css">
    <script type="module" src="/src/pages/login.js"></script>
</head>
<body>
    <a class="skip-link" href="#contenu">Aller au contenu</a>
    <main class="page">
        <section id="contenu" class="auth-shell" aria-labelledby="login-title">
            <div class="auth-visual" aria-hidden="true">
                <div class="station-mark">
                    <span></span>
                    <strong>EV</strong>
                </div>
                <div class="auth-visual-content">
                    <p class="eyebrow">Station de recharge</p>
                    <h1>Espace utilisateur</h1>
                    <p class="lead">Retrouvez vos réservations, vos sessions et vos moyens d’accès.</p>
                </div>
            </div>

            <div class="auth-card">
                <p class="eyebrow">Connexion</p>
                <h2 id="login-title">Accéder au compte</h2>

                <form id="login-form" class="auth-form" novalidate>
                    <div class="field">
                        <label for="identifiant">Pseudo ou e-mail</label>
                        <input id="identifiant" name="identifiant" type="text" autocomplete="username" inputmode="email" required>
                    </div>
                    <div class="field">
                        <label for="password">Mot de passe</label>
                        <input id="password" name="password" type="password" autocomplete="current-password" required>
                    </div>

                    <button class="btn btn-primary" type="submit">Se connecter</button>
                    <p id="login-status" class="status" aria-live="polite"></p>
                </form>

                <div class="cta-row">
                    <a class="btn btn-secondary" href="/register.html">Créer un compte</a>
                    <a class="link-btn" href="/index.html">Accueil</a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
