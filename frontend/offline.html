<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page hors ligne de l'application Métropole Verte.">
    <meta name="theme-color" content="#1f8f55">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/pwa-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/pwa-icon-192.png">
    <title>Hors ligne | Métropole Verte</title>
    <link rel="stylesheet" href="/css/auth.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #f7faf8;
            color: #17231d;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .page {
            width: min(100% - 32px, 860px);
            margin: 0 auto;
            padding: 48px 0;
        }
        .offline-shell {
            display: grid;
            gap: 22px;
            padding: 32px;
            background: #ffffff;
            border: 1px solid #d9e4dc;
            border-radius: 8px;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            gap: 24px;
            align-items: flex-start;
        }
        .eyebrow {
            color: #1f8f55;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        h1 {
            margin: 0;
            font-size: 2.2rem;
        }
        .lead,
        .helper {
            color: #526158;
            line-height: 1.6;
        }
        .header-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 16px;
            border-radius: 8px;
            font-weight: 800;
            text-decoration: none;
        }
        .btn-primary {
            background: #1f8f55;
            color: #ffffff;
        }
        .btn-secondary {
            border: 1px solid #c8d8ce;
            color: #17231d;
        }
        @media (max-width: 700px) {
            .page-header,
            .header-actions {
                display: grid;
            }
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#contenu">Aller au contenu</a>
    <main class="page">
        <section id="contenu" class="dashboard-card app-shell offline-shell" aria-labelledby="offline-title">
            <header class="page-header">
                <div>
                    <p class="eyebrow">Métropole Verte</p>
                    <h1 id="offline-title">Connexion indisponible</h1>
                    <p class="lead">L'application ne peut pas joindre le service pour le moment.</p>
                </div>
                <div class="header-actions">
                    <a class="btn btn-secondary" href="/index.html">Accueil</a>
                    <a class="btn btn-primary" href="/login.html">Se reconnecter</a>
                </div>
            </header>
            <section class="dashboard-panel">
                <p class="panel-title">Que faire ?</p>
                <p class="helper">Vérifiez la connexion réseau, puis rechargez la page. Les écrans de compte, réservation et session nécessitent une connexion au serveur.</p>
            </section>
        </section>
    </main>
</body>
</html>
