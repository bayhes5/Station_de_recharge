<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store">
    <title>Gestion admin | M&eacute;tropole Verte</title>
    <link rel="stylesheet" href="css/auth.css?v=admin-form-1">
    <script defer src="js/api.js?v=admin-form-1"></script>
    <script defer src="js/admin-form.js?v=admin-form-1"></script>
</head>
<body>
    <a class="skip-link" href="#contenu">Aller au contenu</a>
    <main class="page admin-page">
        <section id="contenu" class="dashboard-card admin-form-shell app-shell" aria-labelledby="admin-form-title">
            <header class="page-header admin-header">
                <div>
                    <p class="eyebrow">Administration</p>
                    <h1 id="admin-form-title">Gestion</h1>
                    <p id="admin-form-lead" class="lead">Cr&eacute;ation et modification des donn&eacute;es administratives.</p>
                </div>
                <div class="header-actions">
                    <a id="admin-form-back" class="btn btn-secondary" href="/admin-dashboard.html">Retour &agrave; l&rsquo;administration</a>
                    <button id="admin-form-logout" class="btn btn-secondary" type="button">Se d&eacute;connecter</button>
                </div>
            </header>

            <div id="admin-form-status" class="status" aria-live="polite"></div>

            <section class="dashboard-panel admin-edit-panel">
                <form id="admin-entity-form" class="account-form">
                    <div id="admin-form-fields" class="admin-form-grid"></div>
                    <div class="cta-row">
                        <button id="admin-form-submit" class="btn btn-primary" type="submit">Enregistrer</button>
                        <a id="admin-form-cancel" class="btn btn-secondary" href="/admin-dashboard.html">Annuler</a>
                    </div>
                </form>
            </section>
        </section>
    </main>
</body>
</html>
