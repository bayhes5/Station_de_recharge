<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link rel="stylesheet" href="css/auth.css">
    <script defer src="js/api.js"></script>
    <script defer src="js/register.js"></script>
</head>
<body>
    <main class="page">
        <section class="auth-card">
            <p class="eyebrow">Station de recharge</p>
            <h1>Creer un compte</h1>
            <p class="lead">
                Utilise ce formulaire pour creer ton utilisateur via l'API Django.
            </p>

            <form id="register-form" class="auth-form" novalidate>
                <div class="field">
                    <label for="pseudo">Pseudo</label>
                    <input id="pseudo" name="pseudo" type="text" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="telephone">Telephone</label>
                    <input id="telephone" name="telephone" type="tel" autocomplete="tel">
                </div>
                <div class="field">
                    <label for="password">Mot de passe</label>
                    <input id="password" name="password" type="password" autocomplete="new-password" required>
                </div>
                <div class="field">
                    <label for="password-confirm">Confirmation du mot de passe</label>
                    <input id="password-confirm" name="passwordConfirm" type="password" autocomplete="new-password" required>
                </div>

                <button class="btn btn-primary" type="submit">S'inscrire</button>
                <p id="register-status" class="status" aria-live="polite"></p>
            </form>

            <div class="cta-row">
                <a class="btn btn-secondary" href="/login.html">J'ai deja un compte</a>
                <a class="link-btn" href="/">Retour a l'accueil</a>
            </div>
        </section>
    </main>
</body>
</html>
